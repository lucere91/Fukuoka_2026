<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f7f8fb"><meta name="color-scheme" content="light">
<title>후쿠오카 2026 | 여행 가계부</title>
<link rel="stylesheet" href="style.css">
<script src="data/ledger.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="app">
<header class="nav">
  <div class="nav-name"><div class="mark">¥</div><div><h1>여행 가계부</h1><p>후쿠오카 · 11.2–11.5</p></div></div>
  <div class="nav-right"><span class="small-dot"></span>2인 공동</div>
</header>
<main>
  <section class="main-summary" aria-label="공금 현황">
    <div class="summary-top"><span>남은 공금</span><span class="subtle-chip">잔액</span></div>
    <div class="main-money" id="sharedBalance">¥23,072</div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <div class="two-values"><div><span>누적 사용</span><strong id="sharedSpent">¥36,928</strong></div><div><span>총 공금</span><strong id="sharedTotal">¥60,000</strong></div></div>
  </section>
  <section class="quick-stats" aria-label="개인카드 현황">
    <div class="stat"><span>개인카드 사용</span><strong id="cardSpent">¥2,978</strong></div>
    <div class="stat"><span>엔화계좌 잔액</span><strong id="cardBalance">¥47,022</strong></div>
  </section>
  <section class="activity" aria-label="거래내역">
    <div class="section-title"><h2>거래내역</h2><span class="tx-total" id="txCount"></span></div>
    <div class="account-tabs" id="accountTabs" role="tablist" aria-label="지출 구분">
      <button type="button" class="active" data-kind="all" role="tab" aria-selected="true">전체</button>
      <button type="button" data-kind="shared" role="tab" aria-selected="false">공금</button>
      <button type="button" data-kind="personal" role="tab" aria-selected="false">개인카드</button>
    </div>
    <div class="date-tabs" id="dateTabs" aria-label="날짜 선택">
      <button type="button" class="active" data-date="all">전체</button>
      <button type="button" data-date="2026-11-02">11.2 월</button>
      <button type="button" data-date="2026-11-03">11.3 화</button>
      <button type="button" data-date="2026-11-04">11.4 수</button>
      <button type="button" data-date="2026-11-05">11.5 목</button>
    </div>
    <div class="control-row"><span id="filterResult">내역 불러오는 중</span><div class="switcher" aria-label="조회 방식"><button id="listMode" type="button" class="active" aria-pressed="true">목록</button><button id="galleryMode" type="button" aria-pressed="false">사진</button></div></div>
    <div id="transactions" class="transactions" aria-live="polite"></div>
  </section>
</main>
<footer><span id="lastUpdated">2026.11.03 업데이트</span><a href="https://docs.google.com/spreadsheets/d/10TRwn30Vk7KGTMkjnGz3nT9A7SFL55dM0TQvYzqgTwU/edit" target="_blank" rel="noopener noreferrer">구글시트 입력 <svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a></footer>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="영수증 보기">
  <div class="modal-header"><button id="closeModal" class="round-close" aria-label="닫기"><svg width="19" height="19" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.3" fill="none"><path d="M18 6 6 18M6 6l12 12"/></svg></button><div class="modal-header-label">영수증 <span id="modalIndex"></span></div><a id="imageOpen" target="_blank" rel="noopener noreferrer">원본 <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div>
  <div class="modal-scroll"><div class="modal-merchant" id="modalMerchant"></div><div class="modal-amount" id="modalAmount"></div><div class="modal-date" id="modalDate"></div><div class="scan-wrap"><img id="modalPhoto" alt="영수증 사진" /></div><p class="zoom-hint">사진을 확대하려면 손가락 두 개로 벌려주세요.</p></div>
  <div class="modal-controls"><button id="prevPhoto" aria-label="이전 영수증">‹ 이전</button><button id="nextPhoto" aria-label="다음 영수증">다음 ›</button></div>
</div>
</body></html>
